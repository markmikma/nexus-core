services:
  traefik:
    image: traefik:v3.6.1
    container_name: nexus-traefik
    environment:
      DOCKER_API_VERSION: "1.44"
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=nexus-net"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.metrics.address=:8082"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=metrics"
      - "--ping=true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - nexus-net

  gitea:
    image: gitea/gitea:1.21
    container_name: nexus-gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__ROOT_URL=http://gitea.localhost/
      - GITEA__server__DOMAIN=gitea.localhost
      - GITEA__server__SSH_DOMAIN=gitea.localhost
      - GITEA__server__SSH_PORT=2223
      - GITEA__webhook__ALLOWED_HOST_LIST=private
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=nexus-net"
      - "traefik.http.routers.gitea.rule=Host(`gitea.localhost`)"
      - "traefik.http.routers.gitea.entrypoints=web"
      - "traefik.http.services.gitea.loadbalancer.server.port=3000"
    ports:
      - "2223:22"
    volumes:
      - ./gitea_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - nexus-net

  orchestrator:
    build:
      context: ..
      dockerfile: apps/orchestrator/Dockerfile
    container_name: nexus-orchestrator
    environment:
      GITEA_WEBHOOK_SECRET: ${GITEA_WEBHOOK_SECRET:?Set it in infra/.env}
      NEXUS_ALLOWED_REPOSITORY: nexusadmin/nexus-core
      NEXUS_STATUS_TOKEN: ${NEXUS_STATUS_TOKEN:-}
      NEXUS_DEPLOY_TOKEN: ${NEXUS_DEPLOY_TOKEN:-}
    volumes:
      - ../data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - nexus-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=nexus-net"
      - "traefik.http.routers.orchestrator.rule=Host(`orchestrator.localhost`)"
      - "traefik.http.routers.orchestrator.entrypoints=web"
      - "traefik.http.services.orchestrator.loadbalancer.server.port=8000"
      - "traefik.http.routers.nexus-dashboard.rule=Host(`nexus.localhost`)"
      - "traefik.http.routers.nexus-dashboard.entrypoints=web"
      - "traefik.http.services.nexus-dashboard.loadbalancer.server.port=8000"
  deployment-worker:
    build:
      context: ..
      dockerfile: apps/orchestrator/Dockerfile
    container_name: nexus-deployment-worker
    command: ["python", "-m", "src.worker"]
    environment:
      NEXUS_ALLOWED_REPOSITORY: nexusadmin/nexus-core
      GITEA_REPOSITORY_URL: ssh://git@gitea:22/nexusadmin/nexus-core.git
      NEXUS_IMAGE_SCAN_ENABLED: "true"
      NEXUS_IMAGE_SCAN_SEVERITIES: CRITICAL
      NEXUS_TRIVY_IGNORE_UNFIXED: "true"
      NEXUS_TRIVY_IMAGE: aquasec/trivy:0.57.1
      NEXUS_TRIVY_CACHE_VOLUME: nexus-trivy-cache
    volumes:
      - ../data:/app/data
      - worker-workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - ./secrets/deployment_worker_ed25519:/run/secrets/gitea_deploy_key:ro
      - ./secrets/gitea_known_hosts:/run/secrets/gitea_known_hosts:ro
    networks:
      - nexus-net
    depends_on:
      orchestrator:
        condition: service_healthy
      gitea:
        condition: service_healthy
    restart: unless-stopped

  gitea-runner:
    image: gitea/act_runner:latest
    container_name: nexus-gitea-runner
    profiles: ["ci"]
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN:-}
      GITEA_RUNNER_NAME: nexus-core-ci
      GITEA_RUNNER_LABELS: nexus-ci:docker://python:3.10-slim
    volumes:
      - ./act_runner/config.yaml:/config.yaml:ro
      - runner-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - nexus-net
    depends_on:
      gitea:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: nexus-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - nexus-net
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: nexus-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - nexus-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: nexus-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - nexus-net
    depends_on:
      - prometheus
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=nexus-net"
      - "traefik.http.routers.grafana.rule=Host(`grafana.localhost`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"

networks:
  nexus-net:
    name: nexus-net
    driver: bridge
volumes:
  worker-workspace:
  runner-data:
  prometheus-data:
  grafana-data:
  trivy-cache:
    name: nexus-trivy-cache
