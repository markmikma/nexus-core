services:
  traefik:
    image: traefik:v3.6.1
    container_name: nexus-traefik
    environment:
      DOCKER_API_VERSION: "1.44"
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=nexus-net"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - nexus-net

  gitea:
    image: gitea/gitea:1.21
    container_name: nexus-gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__ROOT_URL=http://gitea.localhost/
      - GITEA__server__DOMAIN=gitea.localhost
      - GITEA__server__SSH_DOMAIN=gitea.localhost
      - GITEA__server__SSH_PORT=2223
      - GITEA__webhook__ALLOWED_HOST_LIST=private
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=nexus-net"
      - "traefik.http.routers.gitea.rule=Host(`gitea.localhost`)"
      - "traefik.http.routers.gitea.entrypoints=web"
      - "traefik.http.services.gitea.loadbalancer.server.port=3000"
    ports:
      - "2223:22"
    volumes:
      - ./gitea_data:/data
    networks:
      - nexus-net

  orchestrator:
    build:
      context: ..
      dockerfile: apps/orchestrator/Dockerfile
    container_name: nexus-orchestrator
    environment:
      GITEA_WEBHOOK_SECRET: ${GITEA_WEBHOOK_SECRET:?Set it in infra/.env}
      NEXUS_ALLOWED_REPOSITORY: nexusadmin/nexus-core
    volumes:
      - ../data:/app/data
    networks:
      - nexus-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=nexus-net"
      - "traefik.http.routers.orchestrator.rule=Host(`orchestrator.localhost`)"
      - "traefik.http.routers.orchestrator.entrypoints=web"
      - "traefik.http.services.orchestrator.loadbalancer.server.port=8000"
  deployment-worker:
    build:
      context: ..
      dockerfile: apps/orchestrator/Dockerfile
    container_name: nexus-deployment-worker
    command: ["python", "-m", "src.worker"]
    environment:
      NEXUS_ALLOWED_REPOSITORY: nexusadmin/nexus-core
      GITEA_REPOSITORY_URL: ssh://git@gitea:22/nexusadmin/nexus-core.git
    volumes:
      - ../data:/app/data
      - worker-workspace:/workspace
      - /var/run/docker.sock:/var/run/docker.sock
      - ./secrets/deployment_worker_ed25519:/run/secrets/gitea_deploy_key:ro
      - ./secrets/gitea_known_hosts:/run/secrets/gitea_known_hosts:ro
    networks:
      - nexus-net
    depends_on:
      - orchestrator
    restart: unless-stopped
networks:
  nexus-net:
    name: nexus-net
    driver: bridge
volumes:
  worker-workspace:
