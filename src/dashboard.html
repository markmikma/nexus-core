<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nexus-Core Control Plane</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui;background:#0b1020;color:#e7edf8}
    body{max-width:1100px;margin:40px auto;padding:0 20px}.panel{background:#151c30;border:1px solid #293652;border-radius:12px;padding:18px;margin:20px 0}
    .muted{color:#9ba8bc}input{background:#0b1020;color:#e7edf8;border:1px solid #405276;border-radius:6px;padding:10px;margin:3px;min-width:220px}
    button{background:#4f8cff;color:white;border:0;border-radius:6px;padding:10px;cursor:pointer}.danger{background:#875160}
    table{border-collapse:collapse;width:100%;margin-top:12px}th,td{border-bottom:1px solid #293652;padding:10px;text-align:left}
    .success{color:#5ee6a8}.failed{color:#ff7b8d}.running,.queued{color:#ffd166}code,pre{font-family:ui-monospace,monospace}
    pre{white-space:pre-wrap;max-height:420px;overflow:auto}a{color:#8ab4ff;cursor:pointer}
  </style>
</head>
<body>
  <h1>Nexus-Core Control Plane</h1>
  <p class="muted">Local GitOps and DevSecOps evidence view.</p>
  <section class="panel" id="login-panel">
    <input id="username" value="admin" autocomplete="username" aria-label="Username">
    <input id="password" type="password" placeholder="Dashboard password" autocomplete="current-password" aria-label="Password">
    <button id="login-button">Sign in</button>
    <p id="message" class="muted"></p>
  </section>
  <section class="panel" id="session-panel" hidden>
    <span id="role-label"></span>
    <button class="danger" id="logout-button">Sign out</button>
  </section>
  <section class="panel">
    <h2>Recent deployments</h2>
    <table><thead><tr><th>ID</th><th>Status</th><th>Commit</th><th>Finished</th><th>Evidence</th></tr></thead>
    <tbody id="jobs"><tr><td colspan="5" class="muted">Sign in first.</td></tr></tbody></table>
  </section>
  <section class="panel" id="report-panel" hidden><h2 id="report-title">Security report</h2><pre id="report"></pre></section>
<script>
const message=document.querySelector('#message');
const jobs=document.querySelector('#jobs');
const roleLabel=document.querySelector('#role-label');
let role='';
async function api(path){
  const response=await fetch(path);
  if(!response.ok) throw new Error(response.status+': '+await response.text());
  return response.json();
}
function makeLink(text, click){
  const link=document.createElement('a'); link.textContent=text; link.onclick=click; return link;
}
async function showReport(commit, type){
  const item=await api('/security-reports/'+encodeURIComponent(commit)+'/'+encodeURIComponent(type));
  document.querySelector('#report-title').textContent=type;
  document.querySelector('#report').textContent=JSON.stringify(item,null,2);
  document.querySelector('#report-panel').hidden=false;
}
async function reports(commit, cell){
  if(role!=='admin'){cell.textContent='Admin only'; return;}
  const data=await api('/security-reports/'+encodeURIComponent(commit));
  cell.replaceChildren();
  data.items.forEach((item,index)=>{
    if(index) cell.append(document.createElement('br'));
    cell.append(makeLink(item.type,()=>showReport(commit,item.type)));
    cell.append(' ('+item.bytes+' B)');
  });
}
async function loadDeployments(){
  const data=await api('/deployments?limit=12');
  jobs.replaceChildren();
  data.items.forEach(job=>{
    const row=document.createElement('tr');
    const id=document.createElement('td'); id.textContent=job.id;
    const status=document.createElement('td'); status.textContent=job.status; status.className=job.status;
    const commit=document.createElement('td'); const code=document.createElement('code'); code.textContent=job.commit_hash.slice(0,12); commit.append(code);
    const finished=document.createElement('td'); finished.textContent=job.finished_at||'-';
    const evidence=document.createElement('td'); evidence.append(makeLink(role==='admin'?'load':'Admin only',()=>reports(job.commit_hash,evidence)));
    row.append(id,status,commit,finished,evidence); jobs.append(row);
  });
  message.textContent=data.count+' deployments loaded.';
}
async function login(){
  try{
    const response=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value,password:password.value})});
    if(!response.ok) throw new Error(response.status+': '+await response.text());
    role=(await response.json()).role;
    password.value='';
    document.querySelector('#login-panel').hidden=true;
    document.querySelector('#session-panel').hidden=false;
    roleLabel.textContent='Signed in as '+role+'.';
    await loadDeployments();
  }catch(error){message.textContent='Error: '+error.message;}
}
async function logout(){
  await fetch('/auth/logout',{method:'POST'});
  role='';
  document.querySelector('#session-panel').hidden=true;
  document.querySelector('#login-panel').hidden=false;
  document.querySelector('#report-panel').hidden=true;
  jobs.innerHTML='<tr><td colspan="5" class="muted">Sign in first.</td></tr>';
  message.textContent='Signed out.';
}
document.querySelector('#login-button').onclick=login;
document.querySelector('#logout-button').onclick=logout;
</script>
</body></html>
