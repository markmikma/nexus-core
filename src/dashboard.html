<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus-Core Control Plane</title><style>:root{color-scheme:dark;font-family:system-ui;background:#0b1020;color:#e7edf8}body{max-width:1100px;margin:40px auto;padding:0 20px}.panel{background:#151c30;border:1px solid #293652;border-radius:12px;padding:18px;margin:20px 0}.muted{color:#9ba8bc}input{background:#0b1020;color:#e7edf8;border:1px solid #405276;border-radius:6px;padding:10px;margin:3px;min-width:220px}button{background:#4f8cff;color:white;border:0;border-radius:6px;padding:10px;cursor:pointer}table{border-collapse:collapse;width:100%;margin-top:12px}th,td{border-bottom:1px solid #293652;padding:10px;text-align:left}.success{color:#5ee6a8}.failed{color:#ff7b8d}.running,.queued{color:#ffd166}code,pre{font-family:ui-monospace,monospace}pre{white-space:pre-wrap;max-height:420px;overflow:auto}a{color:#8ab4ff;cursor:pointer}</style></head><body><h1>Nexus-Core Control Plane</h1><p class="muted">Lokális GitOps és DevSecOps evidence nézet.</p><section class="panel" id="login"><input id="username" value="admin" autocomplete="username"><input id="password" type="password" placeholder="Dashboard jelszó" autocomplete="current-password"><button id="load">Belépés</button><p id="message" class="muted"></p></section><section class="panel"><h2>Legutóbbi deploymentek</h2><table><thead><tr><th>ID</th><th>Állapot</th><th>Commit</th><th>Befejezve</th><th>Evidence</th></tr></thead><tbody id="jobs"><tr><td colspan="5" class="muted">Jelentkezz be.</td></tr></tbody></table></section><section class="panel" id="report-panel" hidden><h2 id="report-title">Security report</h2><pre id="report"></pre></section><script>let auth='';const message=document.querySelector('#message');async function api(path){const r=await fetch(path,{headers:{Authorization:auth}});if(!r.ok)throw new Error(`${r.status}: ${await r.text()}`);return r.json()}async function reports(commit){const data=await api(`/security-reports/${commit}`);document.querySelector(`#reports-${commit}`).innerHTML=data.items.map(x=>`<a data-type="${x.type}" data-commit="${commit}">${x.type}</a> (${x.bytes} B)`).join('<br>');document.querySelectorAll('[data-type]').forEach(a=>a.onclick=async()=>{const x=await api(`/security-reports/${a.dataset.commit}/${a.dataset.type}`);document.querySelector('#report-title').textContent=a.dataset.type;document.querySelector('#report').textContent=JSON.stringify(x,null,2);document.querySelector('#report-panel').hidden=false})}async function load(){auth='Basic '+btoa(`${username.value}:${password.value}`);try{const data=await api('/deployments?limit=12');jobs.innerHTML=data.items.map(j=>`<tr><td>${j.id}</td><td class="${j.status}">${j.status}</td><td><code>${j.commit_hash.slice(0,12)}</code></td><td>${j.finished_at||'—'}</td><td id="reports-${j.commit_hash}"><a data-load="${j.commit_hash}">betöltés</a></td></tr>`).join('');document.querySelectorAll('[data-load]').forEach(a=>a.onclick=()=>reports(a.dataset.load));message.textContent=`${data.count} deployment betöltve.`}catch(e){message.textContent=`Hiba: ${e.message}`}}load.onclick=load;</script></body></html>
